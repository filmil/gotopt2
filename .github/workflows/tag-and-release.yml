# When run:
# * runs tests to ensure that released version works.
# * tags a new release based on main top of tree.
# * builds a source bundle and uploads it into the release
# * builds binaries and uploads them into the release
#
# The workflow can be run manually, otherwise it runs once a week.
name: Tag and Release

env:
  # The env here is tailored to releasing *one* binary.
  # ZIP_PACKAGE is the package where the zip target is. For //test in this
  # example, the label of the bazel target that zips up a built and released
  # binary is `//test:zip`.
  ZIP_PACKAGE: "//cmd/gotopt2"
  # The name of the binary to package. This workflow packages a single binary
  # into a zip file.
  BINARY_NAME: "bazel-bin/cmd/gotopt2/gotopt2"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_release:
        description: >-
          Release even when no commit asks for a version bump. Use this when a
          change landed with a commit message that conventional-commit parsing
          does not recognise, so the tree is ahead of the last tag but nothing
          triggers a bump.
        type: boolean
        default: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Test"
        run: "bazel test --test_output=errors //..."
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # Without this the action bumps the patch version on every run, even
          # when no commit landed since the last tag. The cron then released the
          # same tree again and again. `false` makes the action emit an empty
          # `new_tag` when no commit asks for a release, and the guards below
          # then skip the release and the publication.
          # Normally `false`, so the action emits an empty `new_tag` when no
          # commit asks for a release and the guards below skip everything.
          # The Run workflow button can override that with `force_release`,
          # which bumps the patch version regardless. That is the escape hatch
          # for a commit whose message conventional-commit parsing does not
          # recognise: the code is on main, but nothing asks for a version.
          default_bump: ${{ inputs.force_release && 'patch' || 'false' }}
      - name: Create a GitHub release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
      - name: Get release tag
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        id: get_version
        run: echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
      - name: Get repo name
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        id: get_repo_name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
      - name: "Publish source archive"
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          exclusions: '*.git* /*node_modules/* .editorconfig /bazel-*'
      - name: "Upload source archive"
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          allowUpdates: true
          artifacts: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"

  release:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ["linux", "darwin"]
        arch: ["amd64", "arm64"]
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Test"
        run: "bazel test --test_output=errors //..."
      - name: "Build binaries for ${{ matrix.os }}_${{ matrix.arch }}"
        run: |
          bazel build \
            --platforms=@rules_go//go/toolchain:${{ matrix.os }}_${{ matrix.arch}} \
            --//cmd/gotopt2:name_part_from_command_line=${{ matrix.os }}-${{ matrix.arch }} \
            //cmd/gotopt2:zip //cmd/gotopt2-generator:zip
      - name: Find version tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          dry_run: true
      - name: "Publish ${{ matrix.os }}_${{ matrix.arch }}"
        uses: ncipollo/release-action@v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          artifacts: "bazel-bin/cmd/gotopt2/gotopt2-${{ matrix.os }}-${{ matrix.arch }}.zip,bazel-bin/cmd/gotopt2-generator/gotopt2-generator-${{ matrix.os }}-${{ matrix.arch }}.zip"
          tag: ${{ steps.tag_version.outputs.previous_tag }}

  publish:
    needs: [tag, release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
