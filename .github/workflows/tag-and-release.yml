# When run:
# * runs tests to ensure that released version works.
# * tags a new release based on main top of tree.
# * builds a source bundle and uploads it into the release
# * builds binaries and uploads them into the release
#
# The workflow can be run manually, otherwise it runs once a week.
name: Tag and Release

env:
  # The env here is tailored to releasing *one* binary.
  # ZIP_PACKAGE is the package where the zip target is. For //test in this
  # example, the label of the bazel target that zips up a built and released
  # binary is `//test:zip`.
  ZIP_PACKAGE: "//cmd/gotopt2"
  # The name of the binary to package. This workflow packages a single binary
  # into a zip file.
  BINARY_NAME: "bazel-bin/cmd/gotopt2/gotopt2"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_release:
        description: >-
          Release even when no commit asks for a version bump. Use this when a
          change landed with a commit message that conventional-commit parsing
          does not recognise, so the tree is ahead of the last tag but nothing
          triggers a bump.
        type: boolean
        default: false

jobs:
  tag:
    runs-on: ubuntu-latest
    # A repository whose default workflow permission is read-only fails the
    # tag push with "Resource not accessible by integration", after the
    # action has already printed the version it computed.
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag action analyses the commits since the previous tag. With
          # the default shallow checkout it finds none, reports "Analysis of 0
          # commits complete: no release", and emits an empty new_tag.
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # Without this the action bumps the patch version on every run, even
          # when no commit landed since the last tag. The cron then released the
          # same tree again and again. `false` makes the action emit an empty
          # `new_tag` when no commit asks for a release, and the guards below
          # then skip the release and the publication.
          # Normally `false`, so the action emits an empty `new_tag` when no
          # commit asks for a release and the guards below skip everything.
          # The Run workflow button can override that with `force_release`,
          # which bumps the patch version regardless. That is the escape hatch
          # for a commit whose message conventional-commit parsing does not
          # recognise: the code is on main, but nothing asks for a version.
          default_bump: ${{ inputs.force_release && 'patch' || 'false' }}

  # Runs the tests, builds the release archive through
  # .github/workflows/release_prep.sh, attests it with
  # actions/attest-build-provenance, and creates the GitHub release.
  #
  # This reusable workflow is not interchangeable with a local equivalent.
  # The Bazel Central Registry verifies the source archive attestation with
  # slsa-verifier against a hard-coded builder id, set in tools/slsa.py of
  # bazelbuild/bazel-central-registry, and that id names release_ruleset.yaml.
  source_release:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write      # upload release files
      id-token: write      # attest provenance
      attestations: write  # attest provenance
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
      release_files: |
        gotopt2-${{ needs.tag.outputs.tag_name }}.zip
      prerelease: false

  release:
    needs: [tag, source_release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ["linux", "darwin"]
        arch: ["amd64", "arm64"]
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Test"
        run: "bazel test --test_output=errors //..."
      - name: "Build binaries for ${{ matrix.os }}_${{ matrix.arch }}"
        run: |
          bazel build \
            --platforms=@rules_go//go/toolchain:${{ matrix.os }}_${{ matrix.arch}} \
            --//cmd/gotopt2:name_part_from_command_line=${{ matrix.os }}-${{ matrix.arch }} \
            //cmd/gotopt2:zip //cmd/gotopt2-generator:zip
      - name: "Publish ${{ matrix.os }}_${{ matrix.arch }}"
        uses: ncipollo/release-action@v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          artifacts: "bazel-bin/cmd/gotopt2/gotopt2-${{ matrix.os }}-${{ matrix.arch }}.zip,bazel-bin/cmd/gotopt2-generator/gotopt2-generator-${{ matrix.os }}-${{ matrix.arch }}.zip"
          tag: ${{ needs.tag.outputs.tag_name }}

  publish:
    needs: [tag, release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}

  # BCR is the only publish that attests, see the note in publish.yml. This
  # job still runs after that one rather than beside it, so that the order in
  # which the two registries see the release stays fixed, and so that turning
  # `attest` back on in publish.yml cannot silently produce two attesting
  # publishes racing to overwrite the same two release assets.
  publish-bcr:
    needs: [tag, publish]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets: inherit
